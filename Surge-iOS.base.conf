encrypted-dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
encrypted-dns-follow-outbound-mode = false
always-real-ip = *.lan,*.direct,cable.auth.com,*.msftconnecttest.com,*.msftncsi.com,network-test.debian.org,detectportal.firefox.com,resolver1.opendns.com,*.srv.nintendo.net,*.stun.playstation.net,xbox.*.microsoft.com,*.xboxlive.com,stun.*,global.turn.twilio.com,global.stun.twilio.com,app.yinxiang.com,injections.adguard.org,local.adguard.org,cable.auth.com,localhost.*.qq.com,localhost.*.weixin.qq.com,*.logon.battlenet.com.cn,*.logon.battle.net,*.blzstatic.cn,music.163.com,*.music.163.com,*.126.net,musicapi.taihe.com,music.taihe.com,songsearch.kugou.com,trackercdn.kugou.com,*.kuwo.cn,api-jooxtt.sanook.com,api.joox.com,joox.com,y.qq.com,*.y.qq.com,streamoc.music.tc.qq.com,mobileoc.music.tc.qq.com,isure.stream.qqmusic.qq.com,dl.stream.qqmusic.qq.com,aqqmusic.tc.qq.com,amobile.music.tc.qq.com,*.xiami.com,*.music.migu.cn,music.migu.cn,proxy.golang.org,*.mcdn.bilivideo.cn,*.cmpassport.com,id6.me,open.e.189.cn,opencloud.wostore.cn,id.mail.wo.cn,mdn.open.wo.cn,hmrz.wo.cn,nishub1.10010.com,enrichgw.10010.com,*.wosms.cn,*.jegotrip.com.cn,*.icitymobile.mobi,*.pingan.com.cn,*.cmbchina.com,*.10099.com.cn,*.microdone.cn,pool.ntp.org,*.pool.ntp.org,ntp.*.com,time.*.com,ntp?.*.com,time?.*.com,time.*.gov,time.*.edu.cn,*.ntp.org.cn,PDC._msDCS.*.*,DC._msDCS.*.*,GC._msDCS.*.*,*.rds.amazonaws.com,*.ts.net
# Intercept hardcoded plaintext DNS too, so AI hosts retain fake-IP routing.
hijack-dns = *:53

wifi-assist = false

allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153

external-controller-access = {{SURGE_API_KEY}}@0.0.0.0:6170

all-hybrid = false
udp-policy-not-supported-behaviour = REJECT
# Surge does no IPv6 itself (no AAAA queries; this is also the default).
# The IPv6 VIF comes up only when the network really has IPv6, so native IPv6
# traffic is captured by Surge instead of bypassing it. Never use "always":
# on IPv4-only networks it advertises a dead IPv6 route and apps hang.
ipv6 = false
ipv6-vif = auto

# more options, see https://manual.nssurge.com/others/misc-options.html

