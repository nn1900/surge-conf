# Clash / mihomo profile — mirrors Shared.ini (the Surge config in this repo).
#
# Policy groups, their member order, and the rule order are kept identical to
# Shared.ini so the two configs route the same way. The rule sets are the Clash
# builds of the same dler-io lists, fetched as rule-providers rather than
# vendored, so mihomo keeps them updated itself.
#
# Requires mihomo (Clash.Meta). Not compatible with the original Clash core:
# it uses dialer-proxy, IP-ASN rules and modern provider fields.
#
# See below for complete config reference
# https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

# The GEOIP,CN rule needs a geo database. mihomo downloads one on first use if
# it is missing, but never refreshes it unless told to. Pinned to the same
# fastly mirror the rule sets come from.
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

# Local only. Set a real secret and bind to 0.0.0.0 explicitly if you want a
# dashboard from another machine — unlike the Surge profiles in this repo, this
# does not expose the controller to the LAN by default.
external-controller: 127.0.0.1:9090
secret: "{{CLASH_SECRET}}"

profile:
  store-selected: true   # persists group choices, like Surge's saved selections
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.direct"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "+.pool.ntp.org"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query

# Transparent proxying. Off by default because it needs elevated privileges.
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

proxies:
{{#vps}}
{{clash}}

{{/vps}}
{{#vps}}
{{clashRelay}}

{{/vps}}
proxy-providers:
{{#subscriptions}}
{{clashProvider}}
{{/subscriptions}}

proxy-groups:
  # include-other-group in Shared.ini expands a subscription's nodes into the
  # group; use: is the mihomo equivalent, and can sit alongside proxies:.
  - name: "Proxy"
    type: select
    proxies: ["Auto - UrlTest", {{vps.names}}]
    use: {{subscriptions.use}}{{subscriptions.clashFilter}}

{{#subscriptions}}
{{clashGroup}}
{{/subscriptions}}

  # The same nodes as the subscription groups, but with its own selection
  # state, so changing the browsing node does not move the chains' entry hop.
  - name: "{{relayGroup}}"
    type: select
    use: {{subscriptions.use}}{{subscriptions.clashFilter}}

  - name: "Auto - UrlTest"
    type: url-test
    use: {{subscriptions.use}}{{subscriptions.clashFilter}}
    url: http://cp.cloudflare.com/generate_204
    interval: 3600
    tolerance: 100
    expected-status: 204   # a captive portal answering 200 is not a live node

  - name: "AI Suite"
    type: select
    proxies: [{{vps.allNames}}, "DIRECT", "REJECT"]
    use: {{subscriptions.use}}{{subscriptions.clashFilter}}

  - name: "Netflix"
    type: select
    proxies: ["Proxy", "DIRECT"]

  - name: "Disney Plus"
    type: select
    proxies: ["Proxy", "DIRECT"]

  - name: "YouTube"
