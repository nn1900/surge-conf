[Proxy]
Direct = direct
Block = reject

{{#vps}}
{{surge}}
{{/vps}}

{{#vps}}
{{surgeRelay}}
{{/vps}}

# macminitw (Taiwan home): chained through the "via" group of VPSes
{{#macminitw}}
{{surge}}
{{/macminitw}}
{{macminitw.surgeTailnet}}

[Proxy Group]
Proxy = select, "Auto - UrlTest", "Auto - Smart", {{vps.names}}{{macminitw.surgeMember}}, {{subscriptions.include}}
{{#subscriptions}}
{{surgeGroup}}
{{surgeNodesGroup}}
{{/subscriptions}}
{{relayGroup}} = select, {{subscriptions.include}}

# macminitw: pick the hop VPS, then the exit (selected by hand)
{{macminitw.surgeGroups}}

# Remote proxies only (or Block); never resolve AI destinations via DIRECT.
AI Suite = select, {{vps.allNames}}{{macminitw.surgeMember}}, Block{{subscriptions.groupsMember}}

# Every routing group offers the connectivity providers after its usual
# default: VPSes, Taiwan Home, and each subscription as one group entry
# (pick the node inside it) rather than every node inline.
Streaming = select, Proxy, Direct, {{vps.names}}{{macminitw.surgeMember}}{{subscriptions.groupsMember}}
Asian TV = select, {{macminitw.surgeMemberLead}}Proxy, Direct, {{vps.names}}{{subscriptions.groupsMember}}
Apple = select, Direct, Proxy, {{vps.names}}{{macminitw.surgeMember}}{{subscriptions.groupsMember}}
# Stable-IP-sensitive accounts (PayPal, exchanges): Direct now, Taiwan Home later.
Finance = select, Direct{{macminitw.surgeMember}}, Proxy, {{vps.names}}{{subscriptions.groupsMember}}
Domestic = select, Direct, Proxy, {{vps.names}}{{macminitw.surgeMember}}{{subscriptions.groupsMember}}

AdBlock = select, Block, Direct, Proxy
Others = select, Proxy, Direct, {{vps.names}}{{macminitw.surgeMember}}{{subscriptions.groupsMember}}

Auto - UrlTest = url-test, {{subscriptions.include}}, url=http://cp.cloudflare.com/generate_204, interval=3600, tolerance=100, hidden=true
Auto - Smart = smart, {{subscriptions.include}}, evaluate-before-use=true, hidden=true

[Rule]
# Work: AWS private DBs over Tailscale, never via a remote proxy.
DOMAIN-SUFFIX,rds.amazonaws.com,DIRECT
IP-CIDR,10.75.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
# Tailscale's own control/DERP/peer UDP (macOS); keeps direct NAT traversal.
PROCESS-NAME,tailscaled,DIRECT
# Surge's own Tailscale policy: its control plane must not route through a
# group that can select that policy, or it deadlocks. These hosts work DIRECT.
DOMAIN,controlplane.tailscale.com,DIRECT
DOMAIN,login.tailscale.com,DIRECT
DOMAIN,log.tailscale.com,DIRECT
DOMAIN-WILDCARD,derp*.tailscale.com,DIRECT
# Everything else (the website, docs) is blocked DIRECT from here.
DOMAIN-SUFFIX,tailscale.com,Proxy
PROCESS-NAME,io.tailscale.ipn.macsys.network-extension,DIRECT
PROCESS-NAME,io.tailscale.ipn.macos.network-extension,DIRECT
# Match AI domains before other policies or IP rules can trigger local DNS.
# Surge sends the hostname to the selected proxy for remote resolution.
RULE-SET,Rules/AI_Suite.list,"AI Suite",extended-matching

RULE-SET,SYSTEM,DIRECT

RULE-SET,Rules/AdBlock.list,AdBlock,extended-matching
RULE-SET,Rules/Special.list,Apple,extended-matching

