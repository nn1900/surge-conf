# IP-based from here down. These force a DNS lookup before they can match,
# so they stay below every domain ruleset.
RULE-SET,LAN,DIRECT
RULE-SET,Rules/Domestic_IPs.list,Domestic
RULE-SET,Rules/ASN.China.list,Domestic

GEOIP,CN,Domestic
FINAL,Others,dns-failed
