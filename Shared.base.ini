[Proxy]
Direct = direct
Block = reject

{{#vps}}
{{surge}}
{{/vps}}

{{#vps}}
{{surgeRelay}}
{{/vps}}

[Proxy Group]
Proxy = select, "Auto - UrlTest", "Auto - Smart", {{vps.names}}, {{subscriptions.include}}
{{#subscriptions}}
{{surgeGroup}}
{{surgeNodesGroup}}
{{/subscriptions}}
{{relayGroup}} = select, {{subscriptions.include}}

# Remote proxies only (or Block); never resolve AI destinations via DIRECT.
AI Suite = select, {{vps.allNames}}, Block, {{subscriptions.include}}

Netflix = select, Proxy, Direct
Disney Plus = select, Proxy, Direct
YouTube = select, Proxy, Direct
Max = select, Proxy, Direct
Spotify = select, Proxy, Direct

Asian TV = select, Proxy, Direct
Global TV = select, Proxy, Direct
CN Mainland TV = select, Direct, Proxy
Apple TV = select, Proxy, Direct

Crypto = select, Proxy, Direct
Discord = select, Proxy, Direct
Google FCM = select, Proxy, Direct
Microsoft = select, Proxy, Direct
PayPal = select, Direct, Proxy
Scholar = select, Direct, Proxy
Speedtest = select, Proxy, Direct
Steam = select, Proxy, Direct
TikTok = select, Proxy, Direct

Apple Push = select, Direct, Proxy
Apple Services = select, Direct, Proxy
Telegram = select, Proxy, Direct
miHoYo = select, Direct, Proxy
Special = select, Direct, Proxy
Domestic = select, Direct, Proxy

AdBlock = select, Block, Direct, Proxy
Others = select, Proxy, Direct, {{subscriptions.include}}

Auto - UrlTest = url-test, {{subscriptions.include}}, url=http://cp.cloudflare.com/generate_204, interval=3600, tolerance=100
Auto - Smart = smart, {{subscriptions.include}}, evaluate-before-use=true

[Rule]
# Work: AWS private DBs over Tailscale, never via a remote proxy.
DOMAIN-SUFFIX,rds.amazonaws.com,DIRECT
IP-CIDR,10.75.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
# Tailscale's own control/DERP/peer UDP (macOS); keeps direct NAT traversal.
PROCESS-NAME,tailscaled,DIRECT
PROCESS-NAME,io.tailscale.ipn.macsys.network-extension,DIRECT
PROCESS-NAME,io.tailscale.ipn.macos.network-extension,DIRECT
# Match AI domains before other policies or IP rules can trigger local DNS.
# Surge sends the hostname to the selected proxy for remote resolution.
RULE-SET,Rules/AI_Suite.list,"AI Suite",extended-matching

RULE-SET,SYSTEM,DIRECT

RULE-SET,Rules/AdBlock.list,AdBlock,extended-matching
RULE-SET,Rules/Special.list,Special,extended-matching

RULE-SET,Rules/Media/Netflix.list,Netflix,extended-matching
RULE-SET,Rules/Media/Disney_Plus.list,"Disney Plus",extended-matching
RULE-SET,Rules/Media/YouTube.list,YouTube,extended-matching
RULE-SET,Rules/Media/YouTube_Music.list,YouTube,extended-matching
RULE-SET,Rules/Media/Max.list,Max,extended-matching
RULE-SET,Rules/Media/Spotify.list,Spotify,extended-matching

